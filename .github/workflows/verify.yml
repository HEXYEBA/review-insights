name: Verify container
on:
  push:
    branches: [main, impl/yandex-review-mvp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Compose configuration
        run: docker compose config --quiet
      - name: Build without credentials
        run: docker build -t hse-review-insights:0.1.0 .
      - name: Tests inside the container
        run: docker compose run --rm --no-deps app python -m pytest -q
      - name: Browser and credential isolation
        run: |
          docker compose run --rm --no-deps -T app python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from review_insights.browser_runtime import open_review_context
          assert os.getuid() != 0
          assert not (Path(os.environ['CODEX_HOME']) / 'auth.json').exists()
          version = subprocess.check_output(['codex', '--version'], text=True)
          assert '0.160.1' in version, version
          for directory in (Path(os.environ['CODEX_HOME']), Path('/app/artifacts')):
              probe = directory / '.write-check'
              probe.write_text('runtime volume works')
              probe.unlink()
          with sync_playwright() as pw:
              with open_review_context(pw, mode='persistent', project_root=Path('/app')) as context:
                  page = context.new_page()
                  page.set_content('<h1>Browser works</h1>')
                  assert page.locator('h1').inner_text() == 'Browser works'
          print('Non-root browser, Codex CLI and writable volumes work; no baked-in login.')
          PY
      - name: Web application health
        run: |
          docker compose up --no-build -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8503/_stcore/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
